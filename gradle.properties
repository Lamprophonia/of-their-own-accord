# Gradle settings. The Java 21 JDK must be installed locally.
org.gradle.jvmargs=-Xmx1G
org.gradle.caching=true
org.gradle.configuration-cache=true

# Runtime baseline: Minecraft 1.21.1 and the loader used by ATM10 8.2.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
neo_version_range=[21.1.251,21.2)
# NeoForge 21.1.251 uses FancyModLoader 4; this is separate from NeoForge's version.
loader_version_range=[4,5)

# Mod identity. These values also supply the generated mod metadata.
mod_id=otoa
mod_name=Of Their Own Accord
mod_version=0.2.0
mod_group_id=com.lamprophonia.otoa
mod_license=All Rights Reserved
