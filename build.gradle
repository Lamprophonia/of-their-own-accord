// Based on the official Minecraft 1.21.1 ModDevGradle starter:
// https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/tree/ad911709f06d3bdd5b1a500023a9156999216351
// Its license notice is preserved in TEMPLATE_LICENSE.txt.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Compile against Java 21 regardless of the IDE's default JDK.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // Each development launch has its own worlds, configuration, and logs.
    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    // Make the mod's compiled main sources available in both development runs.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expand the metadata template into build/, leaving the source template intact.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def metadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license
    ]
    inputs.properties(metadataProperties)
    expand(metadataProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

// Connect the interactive terminal when launching, including on cached runs.
tasks.named('runServer', JavaExec).configure {
    doFirst {
        standardInput = System.in
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Stable entry ordering and timestamps make archive output reproducible.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from('TEMPLATE_LICENSE.txt') {
        into('META-INF')
    }
}

// Preserve the pinned Gradle version and checksum when regenerating the wrapper.
tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '9.2.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f'
}

// Allow IntelliJ to show Minecraft and NeoForge source documentation.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
